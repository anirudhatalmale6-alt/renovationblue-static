<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renovation Blue &ndash; phone comparison</title>
<meta name="robots" content="noindex">
<style>
  :root { --blue:#2560A7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         background:#111; color:#fff; }
  header { position:sticky; top:0; z-index:10; background:#111; padding:14px 12px 12px;
           box-shadow:0 2px 10px rgba(0,0,0,.6); }
  h1 { font-size:16px; margin:0 0 4px; font-weight:600; }
  p.hint { margin:0 0 12px; font-size:13px; color:#bbb; line-height:1.4; }
  .toggle { display:flex; gap:8px; }
  .toggle button { flex:1; padding:12px 8px; font-size:15px; font-weight:600; border:0; border-radius:8px;
                   background:#2a2a2a; color:#ddd; cursor:pointer; }
  .toggle button.on { background:var(--blue); color:#fff; }
  .stage { position:relative; }
  .stage img { display:none; width:100%; height:auto; }
  .stage img.on { display:block; }
  .tag { position:fixed; left:50%; transform:translateX(-50%); bottom:16px; z-index:20;
         background:rgba(0,0,0,.82); color:#fff; padding:9px 18px; border-radius:20px;
         font-size:13px; font-weight:600; letter-spacing:.4px; pointer-events:none; }
</style>
</head>
<body>
<header>
  <h1>Renovation Blue &ndash; phone comparison</h1>
  <p class="hint">Same phone width, both sliders on the first slide. Tap the buttons to flick between them &ndash; anything that shifts is a real difference.</p>
  <div class="toggle">
    <button id="bLive">Your live site</button>
    <button id="bNew" class="on">New static build</button>
  </div>
</header>

<div class="stage">
  <img id="imgLive" src="live.jpg" alt="Live WordPress site on a phone">
  <img id="imgNew" class="on" src="new.jpg" alt="New static build on a phone">
</div>

<div class="tag" id="tag">NEW STATIC BUILD</div>

<script>
  var bLive = document.getElementById('bLive'),
      bNew  = document.getElementById('bNew'),
      iLive = document.getElementById('imgLive'),
      iNew  = document.getElementById('imgNew'),
      tag   = document.getElementById('tag');

  function show(which) {
    var live = which === 'live';
    // keep the same spot on the page when swapping
    var ratio = window.scrollY / Math.max(1, document.body.scrollHeight);
    iLive.classList.toggle('on', live);
    iNew.classList.toggle('on', !live);
    bLive.classList.toggle('on', live);
    bNew.classList.toggle('on', !live);
    tag.textContent = live ? 'YOUR LIVE SITE' : 'NEW STATIC BUILD';
    window.scrollTo(0, ratio * document.body.scrollHeight);
  }
  bLive.addEventListener('click', function () { show('live'); });
  bNew.addEventListener('click', function () { show('new'); });
</script>
</body>
</html>
